name: Ad Hoc 서명 빌드 진단

on:
  push:
    paths:
      - '.github/workflows/adhoc-diagnostics.yml'
      - 'scripts/ci-adhoc-archive.sh'
      - 'scripts/ci-adhoc-profile.py'
      - 'scripts/ci-adhoc-diagnostics.py'

permissions:
  contents: read

concurrency:
  group: adhoc-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  signing-build:
    name: archive·export 실패 원인과 실제 서명 검사
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
      IOS_ADHOC_APP_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_APP_PROFILE_BASE64 }}
      IOS_ADHOC_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_WIDGET_PROFILE_BASE64 }}
      IOS_ADHOC_SHARE_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_SHARE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 비공개 빌드 진단과 임시 산출물 정리
        run: bash scripts/ci-adhoc-archive.sh "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$GITHUB_RUN_ID" --diagnostic
